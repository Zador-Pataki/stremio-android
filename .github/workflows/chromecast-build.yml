name: Chromecast APK Build

on:
  push:
    branches:
      - chromecast-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Chromecast ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add matching ARM64 stream-server JNI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL             "https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/StremioMobile-v1.2.4-arm64-v8a-release.apk"             -o /tmp/upstream-arm64.apk
          unzip -j -o /tmp/upstream-arm64.apk             "lib/arm64-v8a/libstream_server.so"             -d app/src/main/jniLibs/arm64-v8a/
          test -s app/src/main/jniLibs/arm64-v8a/libstream_server.so
          ls -lh app/src/main/jniLibs/arm64-v8a/libstream_server.so

      - name: Configure stable custom signing
        shell: bash
        env:
          CUSTOM_KEYSTORE_B64: ""
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/stremio-custom-debug.jks"
          printf '%s' "${CUSTOM_KEYSTORE_B64}" | base64 --decode > "${keystore}"
          echo "ANDROID_KEYSTORE_FILE=${keystore}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=stremiochromecast" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=stremio-custom" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=stremiochromecast" >> "${GITHUB_ENV}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:compileDebugKotlin :app:assembleDebug --warning-mode all

      - name: Verify ARM64 APK contains stream server
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*arm64-v8a*debug*.apk' | head -n1)"
          test -n "$apk"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libstream_server.so"
          echo "Verified: $apk"
          cp "$apk" app/build/outputs/apk/debug/Stremio-Chromecast-arm64.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: stremio-chromecast-arm64
          path: app/build/outputs/apk/debug/Stremio-Chromecast-arm64.apk
          if-no-files-found: error
